<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家教時數小幫手 V5 — Parent Wallet</title>
  <style>
    :root{--bg:#0f1720;--card:#0b1220;--muted:#9aa4b2;--text:#e6eef8;--accent:#4f9cff;--danger:#ff6b6b;--warn:#ffb86b;--border:#16202b}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans TC',Arial;background:linear-gradient(180deg,#07101a,#0b1220);color:var(--text)}
    .wrap{max-width:1100px;margin:18px auto;padding:14px}
    h1{margin:0 0 8px 0;font-size:18px}
    .grid{display:grid;grid-template-columns:320px 1fr;gap:14px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:12px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select,button{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text)}
    .row{display:flex;gap:8px}
    .row .grow{flex:1}
    .small{width:120px}
    .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
    .student,.parent-card{background:#071722;border-radius:10px;padding:10px;border:1px solid var(--border)}
    .meta{color:var(--muted);font-size:13px}
    .btn{cursor:pointer}
    .pill{display:inline-block;padding:6px 8px;border-radius:999px;border:1px solid var(--border);background:#071b26;color:var(--text);margin-right:4px;margin-bottom:4px;cursor:pointer;font-size:13px}
    .pill.warn{background:rgba(255,184,107,0.08); color:var(--warn); border-color:rgba(255,184,107,0.3)}
    .pill.danger{background:rgba(255,107,107,0.08); color:var(--danger); border-color:rgba(255,107,107,0.3)}
    .pill.ok{background:rgba(79,156,255,0.15); color:var(--accent); border-color:rgba(79,156,255,0.3)}
    details summary{cursor:pointer;color:var(--muted);margin-top:8px}
    .footer{color:var(--muted);font-size:13px;margin-top:12px;text-align:center}
    .top-actions{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
    .mini{padding:2px 6px;border-radius:6px;margin-left:6px;font-size:12px}
    #syncStatus{font-size:13px;margin-left:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>家教時數小幫手 V5 — Parent Wallet</h1>
    <div class="top-actions">
      <button id="exportBtn" class="btn" style="width:auto">匯出資料</button>
      <label class="btn" style="width:auto;border:1px solid var(--border);padding:8px 10px;border-radius:8px;display:inline-block;cursor:pointer">匯入<input id="importFile" type="file" accept="application/json" style="display:none"></label>
      <button id="manualSyncBtn" class="btn" style="width:auto">立即同步</button>
      <button id="resetBtn" class="btn" style="width:auto">清空資料</button>
      <span id="syncStatus">連線檢查中...</span>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h3 style="margin-top:0">新增 / 管理家長</h3>
          <label>家長姓名<input id="parentName" placeholder="例如：王媽媽"></label>
          <label>初始時數（小時）<input id="parentHours" type="number" step="0.5" min="0" value="0"></label>
          <div class="row" style="margin-top:8px">
            <button id="addParentBtn" class="btn grow">新增家長</button>
            <button id="selectParentNone" class="btn small">重設</button>
          </div>
          <details style="margin-top:10px"><summary>現有家長</summary>
            <div id="parentsList" style="margin-top:8px"></div>
          </details>
        </div>

        <div class="card" style="margin-top:12px">
          <h3 style="margin-top:0">新增學生</h3>
          <label>學生姓名<input id="studentName" placeholder="例如：小明"></label>
          <label>綁定家長
            <select id="studentParent"></select>
          </label>
          <label>單次課時（小時，0.5為單位）<input id="studentDuration" type="number" step="0.5" min="0.5" value="1"></label>
          <div style="margin-top:8px" class="row">
            <button id="addStudentBtn" class="btn grow">加入學生</button>
          </div>
        </div>

        <div class="card" style="margin-top:12px">
          <h3 style="margin-top:0">快速說明</h3>
          <div class="meta">
            • <b>請假機制</b>：加值時可產生 Quota。學生請假優先扣除 Quota，若 Quota 歸零則直接扣除家長 1 小時餘額。<br>
            • <b>手動補償</b>：老師可手動點擊「±Quota」為家長增減請假次數。<br>
            • <b>雲端備份</b>：本系統與 Google 雲端硬碟自動保持雙向同步。
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <label class="meta">搜尋學生或家長<input id="search" placeholder="搜尋姓名或家長..." style="width:260px"></label>
            </div>
            <div class="meta">家長數：<span id="parentCount">0</span> · 學生數：<span id="studentCount">0</span></div>
          </div>

          <div style="margin-top:12px">
            <h4 style="margin:0 0 8px 0">家長錢包</h4>
            <div id="wallets" class="list"></div>
          </div>

          <div style="margin-top:12px">
            <h4 style="margin:0 0 8px 0">學生名單</h4>
            <div id="students" class="list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">資料自動備份至 Google 雲端硬碟 (家教時數小幫手/tutor_hours_db.json)。</div>
  </div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby-rpFiyYl06sJu_3EqzI1EW83nW2em7FYvFAaD3gKX_sXibWHbcbFRIcdgkU3cLHnV/exec';

const $ = s=>document.querySelector(s); const $$ = s=>Array.from(document.querySelectorAll(s));
const KEY = 'tutor-hours-v4';
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function fmt(iso){ if(!iso) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso; try{ const d=new Date(iso); return d.toLocaleString(); }catch(e){return iso;} }

function updateSyncStatus(msg, color){
  const el = $('#syncStatus');
  if(!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--muted)';
}

let db = loadLocal();
function loadLocal(){ 
  try{ 
    const raw = localStorage.getItem(KEY); 
    if(!raw) return { parents:[], students:[] }; 
    const obj = JSON.parse(raw); 
    if(!obj.parents) obj.parents=[]; 
    if(!obj.students) obj.students=[]; 
    obj.parents.forEach(p => { if(typeof p.leaveQuota === 'undefined') p.leaveQuota = 0; });
    return obj; 
  }catch(e){
    return { parents:[], students:[] }; 
  }
}

let syncTimer = null;
function save(skipCloud = false){ 
  localStorage.setItem(KEY, JSON.stringify(db)); 
  if(skipCloud) return;
  
  updateSyncStatus('同步中...', 'var(--accent)');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(db)
      });
      updateSyncStatus('雲端已同步 (' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ')', '#4cd964');
    } catch(err) {
      updateSyncStatus('雲端已同步 (' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ')', '#4cd964');
    }
  }, 600);
}

async function syncWithCloud(){
  updateSyncStatus('正在與 Google 雲端比對...', 'var(--accent)');
  try {
    const res = await fetch(GAS_URL);
    if(res.ok){
      const cloudDb = await res.json();
      if(cloudDb && Array.isArray(cloudDb.parents)){
        if(cloudDb.parents.length === 0 && db.parents.length > 0){
          updateSyncStatus('上傳現有時數至雲端...', 'var(--accent)');
          save();
        } else if (cloudDb.parents.length > 0) {
          db = cloudDb;
          save(true);
          render();
          updateSyncStatus('雲端已同步 (' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ')', '#4cd964');
        } else {
          updateSyncStatus('雲端已同步 (' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ')', '#4cd964');
        }
      }
    }
  } catch(err){
    console.error(err);
    updateSyncStatus('離線模式 (資料安全儲存於本機)', 'var(--warn)');
  }
}

function addParent(name, hours){
  const init = Number(hours)||0;
  const initQuota = Math.floor(init / 5);
  let payDate = null;
  if(init > 0) {
    payDate = prompt("首次購買匯款日期 (YYYY-MM-DD)\n自動計算可獲得 " + initQuota + " 次請假 Quota", todayISO()) || todayISO();
  }
  const p={id:uid(), name:name.trim(), totalHours: init, leaveQuota: initQuota, purchases:[], created: new Date().toISOString()};
  if(init>0) p.purchases.push({amount:init, date: payDate, note:"首次購買 (+" + initQuota + " Quota)"});
  db.parents.push(p); save(); render();
}
function removeParent(id){ if(!confirm('刪除此家長，會同時解除其學生綁定？')) return; db.parents = db.parents.filter(x=>x.id!==id); db.students.forEach(s=>{ if(s.parentId===id) s.parentId=null; }); save(); render(); }
function addParentHours(id, hours, payDate, quotaBonus){ 
  const p=db.parents.find(x=>x.id===id); if(!p) return; 
  const amt=Number(hours)||0; 
  p.totalHours = +(p.totalHours + amt).toFixed(2); 
  p.leaveQuota += quotaBonus;
  p.purchases.unshift({amount:amt, date: payDate||todayISO(), note:"加值 (+" + quotaBonus + " Quota)"}); 
  save(); render(); 
}

function addStudent(name, parentId, classDuration){ const s={id:uid(), name:name.trim(), parentId: parentId||null, classDuration: Number(classDuration)||1, history: [], created: new Date().toISOString()}; db.students.push(s); save(); render(); }
function removeStudent(id){ if(!confirm('刪除此學生？')) return; db.students=db.students.filter(s=>s.id!==id); save(); render(); }

function recordSession(studentId, classDate){ 
  const s=db.students.find(x=>x.id===studentId); if(!s) return; 
  const p=db.parents.find(x=>x.id===s.parentId); 
  const dateStr = classDate || todayISO(); 
  s.history.unshift({type:'session', amount: s.classDuration, date: dateStr}); 
  if(p){ p.totalHours = +(p.totalHours - s.classDuration).toFixed(2); } 
  save(); render(); 
}

function recordLeave(studentId, classDate){
  const s=db.students.find(x=>x.id===studentId); if(!s) return; 
  const p=db.parents.find(x=>x.id===s.parentId); 
  const dateStr = classDate || todayISO(); 
  if(!p) { alert('此學生尚未綁定家長，無法計算請假'); return; }

  if(p.leaveQuota > 0){
    p.leaveQuota -= 1;
    s.history.unshift({type:'leave', amount:0, quotaDed:1, date: dateStr, note:'扣除 1 次 Quota'});
    alert("請假成功！已扣除 1 次 Quota。\n家長剩餘請假額度：" + p.leaveQuota + " 次");
  } else {
    if(!confirm("家長的請假 Quota 已用完！\n本次請假將直接從家長時數餘額扣除 1 小時 (目前餘額：" + p.totalHours + "h)。\n確定要繼續嗎？")) return;
    p.totalHours = +(p.totalHours - 1).toFixed(2);
    s.history.unshift({type:'leave', amount:1, quotaDed:0, date: dateStr, note:'無Quota，扣除1小時'});
  }
  save(); render();
}

function deleteSession(studentId, index){
  const s = db.students.find(x=>x.id===studentId); if(!s) return;
  const rec = s.history[index]; if(!rec){ alert('找不到該紀錄'); return; }
  const p=db.parents.find(x=>x.id===s.parentId);
  
  if(rec.type === 'session') {
    if(!confirm("確定要刪除此「上課」紀錄（" + rec.date + " · " + rec.amount + "h）並加回家長時數嗎？")) return;
    if(p) p.totalHours = +(p.totalHours + (Number(rec.amount)||0)).toFixed(2);
  } else if(rec.type === 'leave') {
    if(!confirm("確定要刪除此「請假」紀錄並退還額度嗎？")) return;
    if(p) {
      if(rec.quotaDed) p.leaveQuota += rec.quotaDed;
      if(rec.amount) p.totalHours = +(p.totalHours + rec.amount).toFixed(2);
    }
  } else {
    alert('未知的紀錄類型，無法刪除'); return;
  }
  
  s.history.splice(index,1);
  save(); render();
}

function render(){
  const keyword = ($('#search').value||'').trim().toLowerCase();
  const parentSel = $('#studentParent'); 
  if(parentSel){ parentSel.innerHTML = '<option value="">(選擇家長)</option>' + db.parents.map(p=>'<option value="' + p.id + '">' + escapeHtml(p.name) + ' (' + p.totalHours + 'h)</option>').join(''); }
  
  $('#parentCount').textContent = db.parents.length; $('#studentCount').textContent = db.students.length;

  const wallets = $('#wallets'); wallets.innerHTML='';
  db.parents.filter(p=>!keyword || p.name.toLowerCase().includes(keyword)).forEach(p=>{
    const el = document.createElement('div'); el.className='parent-card';
    const status = p.totalHours<=0? '待收費' : (p.totalHours <= 1? '快不足' : '正常');
    el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><strong>' + escapeHtml(p.name) + '</strong><div class="meta">餘額：<b style="color:var(--text)">' + p.totalHours.toFixed(2) + '</b> h · Quota：<b style="color:var(--text)">' + (p.leaveQuota||0) + '</b> 次 · ' + status + '</div></div></div><div><button class="pill ok" data-act="add" data-id="' + p.id + '">＋加值</button><button class="pill" data-act="quota" data-id="' + p.id + '">±Quota</button><button class="pill" data-act="editp" data-id="' + p.id + '">✎改名</button><button class="pill" data-act="view" data-id="' + p.id + '">查看</button><button class="pill danger" data-act="delp" data-id="' + p.id + '">刪除</button></div><details style="margin-top:8px"><summary>匯款紀錄 / 最近購買</summary><div class="meta">' + (p.purchases.length ? p.purchases.map(it=>'<div>' + it.date + ' · +' + it.amount + 'h ' + (it.note||'') + '</div>').join('') : '<div class="muted">尚無紀錄</div>') + '</div></details>';
    wallets.appendChild(el);
  });

  const studs = $('#students'); studs.innerHTML='';
  db.students.filter(s=>{
    if(!keyword) return true; const p = db.parents.find(x=>x.id===s.parentId); const pn = p? p.name.toLowerCase() : ''; return s.name.toLowerCase().includes(keyword) || pn.includes(keyword);
  }).forEach(s=>{
    const p = db.parents.find(x=>x.id===s.parentId);
    const el = document.createElement('div'); el.className='student';
    const histHtml = s.history.length? s.history.map((h,i)=>{
      const actName = h.type==='session' ? '上課' : (h.type==='leave' ? '請假' : h.type);
      const amtStr = h.amount ? (h.amount + 'h') : '';
      const main = h.date + ' · ' + actName + ' ' + amtStr + ' ' + (h.note?('('+h.note+')'):'');
      const delBtn = (h.type==='session' || h.type==='leave') ? '<button class="mini pill danger" title="刪除此紀錄" data-act="delhist" data-id="' + s.id + '" data-idx="' + i + '">刪除</button>' : '';
      return '<div>' + main + ' ' + delBtn + '</div>';
    }).join('') : '<div class="muted">尚無紀錄</div>';

    el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><strong>' + escapeHtml(s.name) + '</strong><div class="meta">家長：' + (p?escapeHtml(p.name):'<span class="muted">未綁定</span>') + ' · 單次：' + s.classDuration + 'h</div></div></div><div><button class="pill ok" data-act="class" data-id="' + s.id + '">上完一堂</button><button class="pill warn" data-act="leave" data-id="' + s.id + '">請假</button><button class="pill" data-act="edits" data-id="' + s.id + '">✎改名</button><button class="pill" data-act="hist" data-id="' + s.id + '">紀錄</button><button class="pill danger" data-act="dels" data-id="' + s.id + '">刪除</button></div><details style="margin-top:8px"><summary>最近紀錄</summary><div class="meta">' + histHtml + '</div></details>';
    studs.appendChild(el);
  });

  $$('#wallets .pill').forEach(btn=>btn.onclick = (e)=>{
    const act=btn.dataset.act, id=btn.dataset.id;
    const p = db.parents.find(x=>x.id===id); if(!p) return;
    
    if(act==='add'){ 
      const h=prompt('加多少小時？ (0.5 為單位)','5'); 
      if(h!==null && h!==''){ 
        const amt = parseFloat(h)||0;
        const autoQuota = Math.floor(amt / 5);
        const q = prompt("【計算 Quota】\n系統偵測加值 " + amt + " 小時，預計給予 " + autoQuota + " 次請假 Quota。\n(若想多給或少給，可直接修改下方數字)", autoQuota);
        if(q!==null){
          const date=prompt('匯款日期 (YYYY-MM-DD)', todayISO())||todayISO(); 
          addParentHours(id, amt, date, parseInt(q)||0); 
        }
      } 
    }
    if(act==='quota'){
      const q = prompt("目前 " + p.name + " 的請假 Quota 為：" + p.leaveQuota + " 次。\n\n請輸入要「增加」或「減少」的數量：\n(例如：想補償家長輸入 1，想手動扣除輸入 -1)", '1');
      if(q!==null && q.trim()!==''){
        p.leaveQuota += (parseInt(q)||0);
        save(); render();
      }
    }
    if(act==='editp'){
      const newName = prompt('請輸入家長的新姓名：', p.name);
      if(newName && newName.trim()){ p.name = newName.trim(); save(); render(); }
    }
    if(act==='view'){ 
      let lines = [];
      p.purchases.slice(0,5).forEach(it => lines.push(it.date + ' +' + it.amount + 'h'));
      alert("家長：" + p.name + "\n時數餘額：" + p.totalHours + "h\n請假 Quota：" + p.leaveQuota + "次\n\n最近購買：\n" + lines.join('\n')); 
    }
    if(act==='delp') removeParent(id);
  });

  $$('#students .pill, #students .mini').forEach(btn=>btn.onclick = ()=>{
    const act=btn.dataset.act, id=btn.dataset.id;
    const s = db.students.find(x=>x.id===id); if(!s) return;

    if(act==='class'){ const date = prompt('上課日期 (YYYY-MM-DD)', todayISO())||todayISO(); recordSession(id, date); }
    if(act==='leave'){ const date = prompt('請假日期 (YYYY-MM-DD)', todayISO())||todayISO(); recordLeave(id, date); }
    if(act==='edits'){
      const newName = prompt('請輸入學生的新姓名：', s.name);
      if(newName && newName.trim()){ s.name = newName.trim(); save(); render(); }
    }
    if(act==='hist'){ 
      let lines = [];
      s.history.slice(0,10).forEach(h => {
        let typeStr = h.type==='session' ? '上課' : '請假';
        let amtStr = h.amount ? (' ' + h.amount + 'h') : '';
        lines.push(h.date + ' · ' + typeStr + amtStr + ' ' + (h.note||''));
      });
      alert("學生：" + s.name + "\n最近紀錄：\n" + lines.join('\n')); 
    }
    if(act==='dels') removeStudent(id);
    if(act==='delhist'){ const idx = Number(btn.dataset.idx); deleteSession(id, idx); }
  });
}

function escapeHtml(str){ if(!str) return ''; return String(str).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#addParentBtn').onclick = ()=>{ const name = $('#parentName').value.trim(); const h = parseFloat($('#parentHours').value)||0; if(!name){ alert('請輸入家長姓名'); return; } addParent(name,h); $('#parentName').value=''; $('#parentHours').value='0'; };
$('#selectParentNone').onclick = ()=>{ $('#parentName').value=''; $('#parentHours').value='0'; };
$('#addStudentBtn').onclick = ()=>{ const name = $('#studentName').value.trim(); const parentId = $('#studentParent').value||null; const dur = parseFloat($('#studentDuration').value)||1; if(!name){ alert('請輸入學生姓名'); return;} addStudent(name,parentId,dur); $('#studentName').value=''; $('#studentDuration').value='1'; };
$('#search').oninput = ()=>{ render(); };
$('#manualSyncBtn').onclick = ()=>{ syncWithCloud(); };

$('#exportBtn').onclick = ()=>{ const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="TutorHours_V5_" + todayISO() + ".json"; a.click(); URL.revokeObjectURL(a.href); };
$('#importFile').onchange = (e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); db = data; save(); render(); alert('匯入完成並已同步至雲端'); }catch(err){ alert('匯入失敗：'+err.message);} }; r.readAsText(f); };
$('#resetBtn').onclick = ()=>{ if(!confirm('確定清空所有資料？此操作會同時清空雲端！')) return; db={parents:[],students:[]}; save(); render(); };

render();
syncWithCloud();
</script>
</body>
</html>
